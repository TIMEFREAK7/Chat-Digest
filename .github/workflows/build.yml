name: build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set: APK is debug-signed and will not install over a release-signed one"
          fi

      - name: Test and build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :core:test :spike:assembleRelease

      - name: Network code only in ModelDownloader.kt
        run: |
          if grep -rnE 'java\.net\.|HttpURLConnection|okhttp|java\.nio\.channels|Socket\b|WebView|DownloadManager' \
               core/src spike/src --include='*.kt' --include='*.java' | grep -v 'spike/src/main/kotlin/chatdigest/spike/ModelDownloader.kt'; then
            echo "::error::network API used outside ModelDownloader.kt"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: digest-spike-${{ github.run_number }}
          path: spike/build/outputs/apk/release/spike-release.apk
